<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>El Salsa · Menú</title>
<style>
body {
  margin: 0;
  padding: 40px 16px;
  background: #1c100a;
  color: #3a2416;
}

.menu {
  max-width: 740px;
  margin: 0 auto;
  background: #fdf4e3;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 20px 50px rgba(0, 0, 0, .5);
}

.stripe {
  height: 12px;
  background: repeating-linear-gradient(90deg,
    #b7331f 0 16px, #e0a326 16px 32px, #1f7a4d 32px 48px,
    #d2446b 48px 64px, #6b3fa0 64px 80px);
}

header {
  padding: 34px 20px 0;
  text-align: center;
}

h1 {
  margin: 0;
  font-size: 3rem;
  letter-spacing: .03em;
  color: #8c2114;
}

.tagline {
  margin: 10px 0 0;
  font-size: .7rem;
  letter-spacing: .3em;
  text-transform: uppercase;
  color: #7a6250;
}

.menu-body {
  padding: 0 20px 40px;
}

.cat-title {
  margin: 40px 0 0;
  text-align: center;
}
.cat-title span {
  display: inline-block;
  padding-bottom: 8px;
  border-bottom: 2px solid #d8c4a2;
  font-size: 1rem;
  letter-spacing: .25em;
  text-transform: uppercase;
  color: #8c2114;
}

.cat-note {
  margin: 8px 0 0;
  text-align: center;
  font-size: .82rem;
  font-style: italic;
  color: #7a6250;
}

.items {
  list-style: none;
  margin: 0;
  padding: 0;
}

.item { margin-top: 18px; }

.row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.name {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
}

.price {
  font-family: sans-serif;
  font-weight: bold;
  color: #8c2114;
  white-space: nowrap;
}

.leader {
  flex: 1;
  min-width: 20px;
  border-bottom: 2px dotted #cdb795;
  transform: translateY(-4px);
}

.desc {
  margin: 3px 0 0;
  font-size: .85rem;
  font-style: italic;
  line-height: 1.5;
  color: #7a6250;
}

.footer {
  margin-top: 44px;
  padding-top: 20px;
  border-top: 2px dotted #d8c4a2;
  text-align: center;
  font-size: .78rem;
  line-height: 1.7;
  color: #7a6250;
}
</style>
</head>

<body>

<div class="menu">

  <div class="stripe"></div>

  <header>
    <h1>El Salsa</h1>
  </header>

  <div class="menu-body">
    {% for c in categorias%}
    <section>
      <h2 class="cat-title"><span>{{ c }}</span></h2>
      <ul class="items">
      {% for p in platillos %}{% if p.tipo == c %}
        <li class="item">
          <div class="row">
            <h3 class="name">{{ p.titulo }}</h3>
            <span class="leader"></span>
            <span class="price">{{ p.precio }}$</span>
          </div>
          <p class="desc">{{ p.descripcion }}</p>
        </li>
	{% endif %}{% endfor %}
      </ul>
    </section>
    {% endfor %}
  </div>
  <div class="stripe"></div>
</div>

</body>
</html>
